            - heading "LexEnergy" [level=1] [ref=f13e145]
          - paragraph [ref=f13e146]: Frontend for a battery-backed EV charging network that helps chargers work in places where normal grid capacity can be limited.
          - paragraph [ref=f13e147]: LexEnergy builds EV charging stations with batteries that support the grid, making it possible to place chargers in more locations. I was the sole frontend owner for the customer-facing charging interface. I designed the full UI and user flow in Figma, then built it with React.
          - paragraph [ref=f13e148]: The interface was used by EV drivers to start a charge, follow the session, handle payment and get support. It supported Swedish and English, and connected to our own API, a pricing API and an external payment partner.
          - paragraph [ref=f13e149]: The hardest part was designing around real charging edge cases. Different cars behaved differently, requirements changed often, and the flow still had to feel simple for someone standing at a charger.
          - paragraph [ref=f13e150]: When I left, the product was live at three stations. What I am most proud of is owning the whole frontend from design to production on a tight deadline.
