          - generic [ref=f17e144]:
            - text: 2023 to 2024
            - heading "Bridging the Digital Education Gap" [level=1] [ref=f17e145]
          - paragraph [ref=f17e146]: Vice Chairman of a Chalmers initiative bringing computers and offline learning tools to schools in KwaZulu-Natal, South Africa.
          - button "See the results" [ref=f17e148]
          - paragraph [ref=f17e151]: CESA, Computer Education in Southern Africa, is a Chalmers student-run project that sends donated computers to rural schools in South Africa. I was Vice Chairman in 2023 to 2024, working with fundraising, logistics and travelling to KwaZulu-Natal with the team to help set everything up on site. We worked together with Star for Life, who support the schools year round and guided us on the ground.
          - paragraph [ref=f17e152]: "Each computer was prepared with Ubuntu and offline learning programs before being shipped. Once we arrived, the work became more practical: troubleshooting, maintenance, setup and helping with whatever the schools needed."
          - paragraph [ref=f17e153]: What stayed with me was how much 15 computers could mean. For the schools, it was not just hardware. It was a way to teach computer education properly and give students a better chance in a world where basic digital skills are expected. Some students reach university on scholarships having barely used a keyboard or mouse before, but are still expected to write assignments and use digital systems from day one. That gap can become the difference between keeping an opportunity and losing it.
          - paragraph [ref=f17e154]: Seeing the computers arrive caught me off guard. The joy was completely open. I had never been in a room where something I take for granted meant that much to someone else. If you want to support the project, you can donate computers or money by contacting the new board at cesaproject.com.
          - generic [ref=f17e155]:
