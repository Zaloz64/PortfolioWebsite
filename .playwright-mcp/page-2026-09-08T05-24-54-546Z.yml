      - paragraph [ref=f14e99]: "I’m a multi-passionate person who loves to learn and take on new challenges. My background is in computer science, and I’ve been programming for nine years now. I still love the problem-solving and creativity it gives you: taking something from nothing into something real."
      - paragraph [ref=f14e100]: "Right now I’m doing my master’s in entrepreneurship and business design, because I want to understand every part of a product: from what makes people buy it to the legal side of building a business."
      - paragraph [ref=f14e101]: Outside of that, I love snowboarding, sailing and climbing. So if you ever want to have a business meeting doing any of those, that would be the dream.
