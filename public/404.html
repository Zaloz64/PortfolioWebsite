<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoé — Portfolio</title>
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages technique).
      GitHub serves this for any unknown path under the site; it rewrites the
      deep link into a query the app's index.html decodes back into the real
      path. pathSegmentsToKeep = 1 keeps the project base ('/PortfolioWebsite/').
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
